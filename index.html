<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eid Mubarak 🌙</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="phase1" class="phase active">
        <div id="search-area">
            <div class="text-wrapper">
                <h2 id="hint-text">Search the sky for the moon...</h2>
            </div>
            
            <div id="reveal-circle"></div>

            <img src="8P.jpg" id="meme-discovery">
            
            <div class="moon-container" id="moon">
                <div class="crescent-moon"></div>
            </div>
        </div>
    </div>

    <div id="phase2" class="phase">
        <div class="video-container">
            <video id="eid-video" playsinline>
                <source src="eid-greeting.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <button id="next-btn" class="hidden" onclick="location.reload()">Restart ✨</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
